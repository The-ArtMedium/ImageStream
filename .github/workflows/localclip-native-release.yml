name: LocalClip Native (Android)

on:
  push:
    tags:
      - 'localclip-native-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LocalClipNative
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - runs-on: ubuntu-24.04
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp build/outputs/apk/debug/*.apk LocalClip-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LocalClip-Android
          path: LocalClipNative/LocalClip-Android.apk
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LocalClipNative/LocalClip-Android.apk
