name: LocalClip Native (Android)

on:
  push:
    tags:
      - 'localclip-native-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: LocalClipNative
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp build/outputs/apk/debug/*.apk LocalClip-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LocalClip-Android
          path: LocalClipNative/LocalClip-Android.apk
      - name: Build signed release bundle (AAB)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: localclip
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
            gradle --no-daemon bundleRelease
            cp build/outputs/bundle/release/*.aab LocalClip-Android.aab
          else
            echo "No signing secrets set: skipping AAB"
          fi
      - uses: actions/upload-artifact@v4
        if: hashFiles('LocalClipNative/LocalClip-Android.aab') != ''
        with:
          name: LocalClip-Android-AAB
          path: LocalClipNative/LocalClip-Android.aab
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LocalClipNative/LocalClip-Android.apk
