name: Release LocalClip Android

on:
  push:
    tags:
      - 'localclip-android-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clear ALL caches
        run: |
          sudo rm -rf ~/.buildozer
          sudo rm -rf ~/.gradle
          sudo rm -rf ~/.android
          sudo rm -rf /tmp/*

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libffi-dev libssl-dev m4 libltdl-dev \
            ccache

      - name: Install Cython and Buildozer
        run: |
          pip install cython==0.29.33 buildozer

      - name: Fix spec line endings
        run: sed -i 's/\r//' LocalClipAndroid/buildozer.spec

      - name: Accept Android licenses
        run: |
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Clear buildozer cache
        run: |
          rm -rf ~/.buildozer
          rm -rf LocalClipAndroid/.buildozer

      - name: Build APK
        run: |
          cd LocalClipAndroid
          yes y | buildozer -v android debug --clean
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Rename APK for release
        run: |
          cd LocalClipAndroid/bin
          apk_file=$(ls *.apk | head -1)
          mv "$apk_file" "LocalClip-${{ github.ref_name }}-Android.apk"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: LocalClipAndroid/bin/LocalClip-${{ github.ref_name }}-Android.apk
