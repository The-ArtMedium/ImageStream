name: Build LocalClip Android

on:
  push:
    branches: [ main ]
    paths:
      - 'LocalClipAndroid/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        run: |
          cd LocalClipAndroid
          yes | buildozer android debug

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalClip-Android-debug
          path: LocalClipAndroid/bin/*.apk