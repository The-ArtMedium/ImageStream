name: Build LocalClip Android

on:
  push:
    branches: [ main ]
    paths:
      - 'LocalClipAndroid/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-11-jdk \
            python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev ffmpeg

      - name: Install buildozer and cython
        run: |
          pip install buildozer cython

      - name: First pass — let buildozer download SDK
        run: |
          cd LocalClipAndroid
          buildozer android debug || true

      - name: Install build tools into buildozer SDK
        run: |
          SDK=~/.buildozer/android/platform/android-sdk
          TOOLS=$(find $SDK -name "sdkmanager" 2>/dev/null | head -1)
          if [ -n "$TOOLS" ]; then
            yes | $TOOLS "build-tools;33.0.2" || true
            yes | $TOOLS "build-tools;30.0.3" || true
          fi

      - name: Second pass — build with tools installed
        run: |
          cd LocalClipAndroid
          buildozer android debug

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalClip-Android-debug
          path: LocalClipAndroid/bin/*.apk
