The `yes |` is not working because buildozer detects it's running as root and blocks. Add this environment variable to skip the check:

```yaml
name: Build LocalClip Android

on:
  push:
    branches: [ main ]
    paths:
      - 'LocalClipAndroid/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: 0
        run: |
          cd LocalClipAndroid
          buildozer android debug

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalClip-Android-debug
          path: LocalClipAndroid/bin/*.apk
```

🎯
