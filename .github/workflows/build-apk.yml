name: Build LocalClip APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
          
          # --- THE SEARCH MODIFICATION ---
          # This finds your spec file anywhere in the "ImageStream" folders
          SPEC_DIR=$(find . -name "buildozer.spec" -exec dirname {} \;)
          cd "$SPEC_DIR"
          echo "Node found the spec in: $SPEC_DIR"
          
          # The "Force-Yes" to stop the Broken Pipe
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalClip-Android-Package
          path: "**/bin/*.apk"
