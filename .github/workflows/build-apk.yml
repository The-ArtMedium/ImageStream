name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Clear space so the NDK/FFmpeg build doesn't choke
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 2. Compilation tools
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libffi-dev libssl-dev m4 libltdl-dev \
            ccache

      - name: Install Cython and Buildozer
        run: |
          pip install cython==0.29.33 buildozer==1.5.0

      # 3. Fix CRLF line endings in case spec was edited on Windows/mobile
      - name: Fix spec line endings
        run: sed -i 's/\r//' LocalClipAndroid/buildozer.spec

      # 4. Accept Android SDK licenses non-interactively
      - name: Accept Android licenses
        run: |
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 5. Build
      - name: Build APK
        run: |
          cd LocalClipAndroid
          yes y | buildozer -v android debug
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalClip-APK
          path: LocalClipAndroid/bin/*.apk
