name: Build LocalClip APK

on:
  workflow_dispatch: # This lets you run it manually from the "Actions" tab

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: LocalClipAndroid
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalClip-APK
          path: LocalClipAndroid/bin/*.apk
          
