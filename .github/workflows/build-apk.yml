name: Build LocalClip APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip git zip unzip libffi-dev libssl-dev \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            cmake ninja-build ant

      - name: Install Buildozer and Cython
        run: |
          pip install --user --upgrade buildozer cython==0.29.33
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          cd LocalClipAndroid
          # We force buildozer to accept licenses and build
          yes | buildozer android debug
        env:
          # This tells buildozer where to put things so it doesn't hit permission errors
          BUILDOZER_ALLOW_ORG_NAME_STUFF: 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalClip-Android-Package
          path: LocalClipAndroid/bin/*.apk
          
