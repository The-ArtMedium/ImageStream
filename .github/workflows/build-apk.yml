name: Build LocalClip APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Buildozer
        run: |
          sudo apt-get update
          # FIXED: Added libsqlite3-dev and pkg-config for the video engine build
          sudo apt-get install -y build-essential libffi-dev libssl-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          zlib1g-dev libsqlite3-dev pkg-config
          
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
          
          # Force the build to accept all Android licenses automatically
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalClip-Android-Package
          path: "**/bin/*.apk"
