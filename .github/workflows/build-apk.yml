name: Build LocalClip APK (v2)

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3 python3-pip python3-setuptools python3-venv \
            libffi-dev libssl-dev libjpeg-dev zlib1g-dev \
            libavcodec-dev libavformat-dev libavdevice-dev \
            libavutil-dev libswscale-dev libswresample-dev \
            libfreetype6-dev libgl1-mesa-dev libgles2-mesa-dev \
            git unzip

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android components
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-33" \
                     "build-tools;33.0.2" \
                     "ndk;25.2.9519653"

      - name: Remove stale Buildozer state
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer

      - name: Install Buildozer globally
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Build APK
        working-directory: LocalClipAndroid
        env:
          ANDROIDSDK: /usr/local/lib/android/sdk
          ANDROIDNDK: /usr/local/lib/android/sdk/ndk/25.2.9519653
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalClip-APK
          path: LocalClipAndroid/bin/*.apk