name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Clear space so the NDK/FFmpeg build doesn't choke
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 2. Add the missing compilation tools
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libffi-dev libssl-dev m4 libltdl-dev

      - name: Install Cython and Buildozer
        run: |
          pip install cython==0.29.33 buildozer

      # 3. Build with log visibility
      - name: Build APK
        run: |
          cd LocalClipAndroid
          # We use "yes y" to handle the Root warning and the Licenses automatically
          yes y | buildozer -v android debug
        env:
          # This helps Buildozer find the Java home correctly
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalClip-APK
          path: LocalClipAndroid/bin/*.apk
