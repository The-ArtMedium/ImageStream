name: Build LocalClip APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          python3 python3-pip python3-setuptools python3-venv \
          libffi-dev libssl-dev libjpeg-dev zlib1g-dev \
          libavcodec-dev libavformat-dev libavdevice-dev \
          libavutil-dev libswscale-dev libswresample-dev \
          libfreetype6-dev libgl1-mesa-dev libgles2-mesa-dev \
          git unzip openjdk-17-jdk

    - name: Install Android SDK + NDK
      uses: android-actions/setup-android@v3
      with:
        sdk-version: "latest"
        ndk-version: "27.0.12077973"
        components: |
          platform-tools
          platforms;android-33
          build-tools;34.0.0

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.37

    - name: Build APK
      env:
        ANDROIDSDK: ${{ env.ANDROID_SDK_ROOT }}
        ANDROIDNDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LocalClip-APK
        path: bin/*.apk