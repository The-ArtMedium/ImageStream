name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Verify Java
      run: |
        java -version
        echo "JAVA_HOME=$JAVA_HOME"

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip wget \
          autoconf automake libtool pkg-config \
          m4 build-essential python3-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install cython==3.0.12 buildozer==1.5.0

    - name: Cache buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-ndk25b-v3

    - name: Cache buildozer local directory
      uses: actions/cache@v4
      with:
        path: LocalClipAndroid/.buildozer
        key: buildozer-local-${{ runner.os }}-${{ hashFiles('LocalClipAndroid/buildozer.spec') }}
        restore-keys: |
          buildozer-local-${{ runner.os }}-

    - name: Build APK
      run: |
        yes | buildozer android debug 2>&1 | tee build.log
      working-directory: LocalClipAndroid
      env:
        BUILDOZER_WARN_ON_ROOT: "1"

    - name: Find APK
      run: |
        echo "=== bin/ contents ==="
        ls -la LocalClipAndroid/bin/ || echo "bin/ does not exist"
        echo "=== Full APK search ==="
        find . -name "*.apk" 2>/dev/null || echo "No APK found"

    - name: Show last 100 lines of build log
      if: always()
      run: tail -100 LocalClipAndroid/build.log || echo "No build.log found"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: localclip-debug
        path: LocalClipAndroid/bin/*.apk
        if-no-files-found: warn