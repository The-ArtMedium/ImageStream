name: Build LocalClip Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip wget curl \
            autoconf automake libtool pkg-config \
            m4 build-essential python3-dev \
            openjdk-17-jdk

      - name: Install Buildozer + Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython<3" "buildozer==1.5.0"

      - name: Cache Buildozer dependencies
        uses: actions/cache@v4
        with:
          path: |
            \~/.buildozer
            \~/.cache/pip
          key: buildozer-\( {{ runner.os }}-py3.11- \){{ hashFiles('LocalClipAndroid/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-py3.11-

      - name: Build the APK
        working-directory: LocalClipAndroid
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log
        env:
          BUILDOZER_WARN_ON_ROOT: "1"

      - name: Show build summary
        if: always()
        run: |
          echo "=== Last 100 lines of build log ==="
          tail -100 LocalClipAndroid/build.log || echo "No build.log found"
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f || echo "No .apk found anywhere"

      - name: Upload APK (if found)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: localclip-debug-apk
          path: LocalClipAndroid/bin/*.apk
          if-no-files-found: warn