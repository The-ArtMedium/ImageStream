name: Build LocalClip Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip wget curl openjdk-17-jdk \
            autoconf automake libtool pkg-config m4 build-essential \
            python3-dev libffi-dev libssl-dev libncurses5-dev \
            libsqlite3-dev libreadline-dev libbz2-dev liblzma-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython<3" "buildozer==1.5.0"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            \~/.buildozer
            \~/.cache/pip
          key: buildozer-\( {{ runner.os }}-py311- \){{ hashFiles('LocalClipAndroid/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-py311-

      - name: Build APK
        working-directory: LocalClipAndroid
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log
        env:
          BUILDOZER_WARN_ON_ROOT: "1"

      - name: Show the real error
        if: always()
        run: |
          echo "=== LAST 400 LINES - THIS CONTAINS THE ACTUAL PROBLEM ==="
          tail -400 LocalClipAndroid/build.log
          echo "=== ERROR KEYWORDS ==="
          grep -Ei "(error|failed|exception|traceback|command failed|gradle|recipe|hostpython|tomli|setuptools|libffi|jdk|clang)" LocalClipAndroid/build.log | tail -50 || echo "No obvious errors found"
          echo "=== APK search ==="
          find . -name "*.apk" -type f || echo "No APK found"
          ls -la LocalClipAndroid/bin/ || true

      - name: Upload APK if it exists
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: localclip-debug-apk
          path: LocalClipAndroid/bin/*.apk
          if-no-files-found: warn