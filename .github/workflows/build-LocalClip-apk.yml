name: Build LocalClip Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip wget curl openjdk-17-jdk \
            autoconf automake libtool pkg-config m4 \
            build-essential python3-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython<3" "buildozer==1.5.0"

      - name: Cache Buildozer dependencies
        uses: actions/cache@v4
        with:
          path: |
            \~/.buildozer
            \~/.cache/pip
          key: buildozer-\( {{ runner.os }}-py311- \){{ hashFiles('LocalClipAndroid/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-py311-

      - name: Build APK
        working-directory: LocalClipAndroid
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log
        env:
          BUILDOZER_WARN_ON_ROOT: "1"

      - name: Show build results
        if: always()
        run: |
          echo "=== Last 150 lines of build log ==="
          tail -150 LocalClipAndroid/build.log || echo "No build.log found"
          echo "=== Searching for any APK anywhere ==="
          find . -name "*.apk" -type f || echo "No APK found"
          echo "=== bin/ folder contents ==="
          ls -la LocalClipAndroid/bin/ || echo "No bin/ folder"
          echo "=== .buildozer dists folder (common APK location) ==="
          ls -la LocalClipAndroid/.buildozer/android/platform/build/*/dists/*/bin/ 2>/dev/null || echo "No dists bin folder"

      - name: Upload APK artifact (if any found)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: localclip-debug-apk
          path: |
            LocalClipAndroid/bin/*.apk
            LocalClipAndroid/.buildozer/android/platform/build/*/dists/*/bin/*.apk
          if-no-files-found: warn