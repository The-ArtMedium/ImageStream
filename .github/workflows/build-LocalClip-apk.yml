steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git openjdk-17-jdk zip unzip wget \
          autoconf automake libtool pkg-config \
          m4 build-essential python3-dev

    - name: Set JAVA_HOME
      run: |
        echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> $GITHUB_ENV

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install cython==3.0.12 buildozer==1.5.0

    - name: Cache buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-ndk25b-v2

    - name: Cache buildozer local directory
      uses: actions/cache@v4
      with:
        path: LocalClipAndroid/.buildozer
        key: buildozer-local-${{ runner.os }}-${{ hashFiles('LocalClipAndroid/buildozer.spec') }}
        restore-keys: |
          buildozer-local-${{ runner.os }}-

    - name: Build APK
      run: |
        yes | buildozer android debug 2>&1 | tee build.log
      working-directory: LocalClipAndroid
      env:
        BUILDOZER_WARN_ON_ROOT: "1"

    - name: Find APK
      run: find . -name "*.apk" 2>/dev/null

    - name: Show last 50 lines if failed
      if: failure()
      run: tail -50 LocalClipAndroid/build.log

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: localclip-debug
        path: LocalClipAndroid/bin/*.apk
        if-no-files-found: warn