name: Build LocalClip Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1.2.0   # latest stable as of 2026
        id: buildozer
        with:
          workdir: LocalClipAndroid
          command: buildozer -v android debug
          buildozer_version: stable

      - name: List generated files (for debugging)
        run: |
          echo "=== All APK files found ==="
          find . -name "*.apk" -type f || echo "No APK found"
          echo "=== Contents of bin folder ==="
          ls -la LocalClipAndroid/bin/ || echo "bin/ folder missing"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: localclip-debug-apk
          path: ${{ steps.buildozer.outputs.filename || 'LocalClipAndroid/bin/*.apk' }}
          if-no-files-found: warn