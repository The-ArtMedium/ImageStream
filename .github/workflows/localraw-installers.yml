name: LocalRAW Installers

on:
  push:
    tags:
      - 'localraw-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            LocalRAW/releases
            LocalRAW/installer
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unpack the LocalRAW source
        shell: bash
        run: |
          mkdir _src
          unzip -q LocalRAW/releases/LocalRAW.zip -d _src
          cp LocalRAW/installer/LocalRAW.spec _src/LocalRAW/LocalRAW.spec
          cp LocalRAW/installer/windows.iss _src/LocalRAW/installer/windows.iss
      - name: Install build tools
        working-directory: _src/LocalRAW
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build the program
        working-directory: _src/LocalRAW
        run: pyinstaller LocalRAW.spec --clean --noconfirm
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        working-directory: _src/LocalRAW
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: LocalRAW-Windows-Setup
          path: _src/LocalRAW/dist/installer/LocalRAW-Setup-1.0.0-Windows.exe
      - name: Put the Setup .exe on the Releases page (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: localraw-latest
          name: LocalRAW (latest build)
          files: _src/LocalRAW/dist/installer/LocalRAW-Setup-1.0.0-Windows.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            LocalRAW/releases
            LocalRAW/installer
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unpack the LocalRAW source
        run: |
          mkdir _src
          unzip -q LocalRAW/releases/LocalRAW.zip -d _src
          cp LocalRAW/installer/LocalRAW.spec _src/LocalRAW/LocalRAW.spec
      - name: Install build tools
        working-directory: _src/LocalRAW
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build the app
        working-directory: _src/LocalRAW
        run: pyinstaller LocalRAW.spec --clean --noconfirm
      - name: Sign the app (ad hoc) and make the disk image
        working-directory: _src/LocalRAW
        run: |
          codesign --force --deep --sign - dist/LocalRAW.app
          mkdir -p dist/dmg
          cp -R dist/LocalRAW.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "LocalRAW" -srcfolder dist/dmg -ov -format UDZO LocalRAW-1.0.0-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: LocalRAW-Mac-dmg
          path: _src/LocalRAW/LocalRAW-1.0.0-macOS.dmg
      - name: Put the .dmg on the Releases page (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: localraw-latest
          name: LocalRAW (latest build)
          body: "Mac: download the .dmg, open it, drag LocalRAW to Applications. Windows: download the Setup .exe. If your computer shows a security warning, see the notice on the ImageStream home page."
          files: _src/LocalRAW/LocalRAW-1.0.0-macOS.dmg
