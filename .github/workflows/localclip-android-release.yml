## LocalClip Android v0.1.0 — Lossless Video Trimmer

Trim videos on your Android tablet or phone. No watermark. No cloud. No account. Free forever.

---

## What It Does

✂️ **Lossless trimming** — ffmpeg stream copy. Zero re-encoding. Zero quality loss. The exported clip is identical quality to the original.

🎯 **Drag handles + manual time input** — drag the handles on the timeline to set your in and out points. Type exact HH:MM:SS for precision. Both work together.

🔒 **Non-destructive** — your original video is never touched. The trimmed clip is saved separately in `LocalClip_Exports/`.

📁 **Exports ready for LocalEdit** — output folder feeds directly into your editing workflow.

🌐 **7 languages** — English · Español · Français · Português · العربية · 中文 · हिन्दी

📴 **100% offline** — no internet needed. Works anywhere.

---

## Install

Download the APK below → open it on your Android device → tap Install.

If prompted: Settings → Allow install from unknown sources → Install.

**Minimum Android:** 5.0 (API 21)
**Optimised for:** Android tablets and phones

---

## Output

Trimmed clips are saved to:
```
LocalClip_Exports/
```
Next to your original video file. Original never modified.

