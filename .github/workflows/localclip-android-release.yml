name: Release LocalClip Android (Signed)

on:
  push:
    tags:
      - 'localclip-android-v*'

permissions:
  contents: write

jobs:
  build-signed-apk:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev ffmpeg

      - name: Install buildozer and dependencies
        run: |
          pip install buildozer cython

      - name: Generate keystore (first run only)
        if: env.KEYSTORE_BASE64 == ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          keytool -genkey -v \
            -keystore localclip.keystore \
            -alias localclip \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass localclip2024 \
            -keypass localclip2024 \
            -dname "CN=LocalClip, OU=TheArtMedium, O=TheArtMedium, L=Unknown, S=Unknown, C=US"
          echo "================================================================"
          echo "KEYSTORE GENERATED — copy the value below and add it as a"
          echo "GitHub Secret named KEYSTORE_BASE64"
          echo "================================================================"
          base64 -w 0 localclip.keystore
          echo ""
          echo "Then re-run this workflow."
          echo "================================================================"

      - name: Restore keystore from secret
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > localclip.keystore

      - name: Build release APK
        run: |
          cd LocalClipAndroid
          buildozer android release

      - name: Sign APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cd LocalClipAndroid/bin
          UNSIGNED=$(ls *-unsigned.apk 2>/dev/null || ls *.apk | head -1)
          zipalign -v 4 "$UNSIGNED" localclip-aligned.apk
          apksigner sign \
            --ks ../../localclip.keystore \
            --ks-key-alias localclip \
            --ks-pass pass:localclip2024 \
            --key-pass pass:localclip2024 \
            --out LocalClip-${{ github.ref_name }}-Android.apk \
            localclip-aligned.apk
          apksigner verify LocalClip-${{ github.ref_name }}-Android.apk
          echo "APK signed and verified"

      - name: Rename APK (unsigned fallback)
        if: env.KEYSTORE_BASE64 == ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cd LocalClipAndroid/bin
          mv *.apk LocalClip-${{ github.ref_name }}-Android-UNSIGNED.apk

      - name: Upload signed APK to release
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        uses: softprops/action-gh-release@v2
        with:
          files: LocalClipAndroid/bin/LocalClip-${{ github.ref_name }}-Android.apk
          body: |
            LocalClip Android ${{ github.ref_name }}

            Signed release APK ready for Play Store.

            Non-destructive lossless video trimming.
            Drag handles + manual time input.
            7 languages · Offline · Free forever.

            Support this work: https://ko-fi.com/satdiva

      - name: Upload unsigned APK (fallback)
        if: env.KEYSTORE_BASE64 == ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        uses: softprops/action-gh-release@v2
        with:
          files: LocalClipAndroid/bin/LocalClip-${{ github.ref_name }}-Android-UNSIGNED.apk
          body: |
            UNSIGNED BUILD — not ready for Play Store.

            Add KEYSTORE_BASE64 secret and re-push the tag.
